docs_dir: wiki

site_name: .NET LLM Wiki
site_description: .NET / C# 编程规范、最佳实践与语法演进的 LLM Wiki 知识库
site_url: https://fenzel999.github.io/llm-wiki-dotnet/
repo_url: https://github.com/fenzel999/llm-wiki-dotnet
repo_name: llm-wiki-dotnet
edit_uri: edit/main/wiki/

theme:
  name: material
  language: zh
  palette:
    - scheme: default
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
      toc_depth: 3
  - attr_list
  - md_in_html
  - def_list
  - footnotes

extra:
  generator: false

extra_css:
  - extra/fonts.css
  - extra/theme.css
  - extra/modes.css

extra_javascript:
  - extra/modes.js

nav:
  - 首页: index.md
  - 全景: overview.md
  - 思维导图: 思维导图.md
  - 操作日志: log.md
  - .NET:
      - dotnet/overview.md
      - C# 语言:
          - C# 现代语言特性: dotnet/csharp/modern-csharp.md
          - C# 14 新特性: dotnet/csharp/csharp-14.md
          - 异步编程: dotnet/csharp/async-await.md
          - LINQ 查询: dotnet/csharp/linq.md
          - 集合选型: dotnet/csharp/collections.md
          - JSON 序列化: dotnet/csharp/serialization.md
          - 源生成器实战: dotnet/csharp/source-generators.md
      - 框架基础:
          - 依赖注入: dotnet/fundamentals/dependency-injection.md
          - 配置与 Options: dotnet/fundamentals/configuration-options.md
          - 测试: dotnet/fundamentals/testing.md
          - 日志与可观测性: dotnet/fundamentals/observability.md
          - HttpClient 与工厂: dotnet/fundamentals/http-client.md
          - 弹性与容错: dotnet/fundamentals/resilience.md
          - 缓存: dotnet/fundamentals/caching.md
          - 后台服务: dotnet/fundamentals/background-services.md
          - 安全加固与机密: dotnet/fundamentals/data-protection.md
      - Web / Minimal API:

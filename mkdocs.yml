docs_dir: wiki

site_name: .NET LLM Wiki
site_description: .NET / C# 编程规范、最佳实践与语法演进的 LLM Wiki 知识库
site_url: https://fenzel999.github.io/llm-wiki-dotnet/
repo_url: https://github.com/fenzel999/llm-wiki-dotnet
repo_name: llm-wiki-dotnet
edit_uri: edit/main/wiki/

theme:
  name: material
  language: zh
  palette:
    - scheme: default
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
      toc_depth: 3
  - attr_list
  - md_in_html
  - def_list
  - footnotes

extra:
  generator: false

extra_css:
  - extra/fonts.css
  - extra/theme.css
  - extra/modes.css

extra_javascript:
  - extra/modes.js

nav:
  - 首页: index.md
  - 全景: overview.md
  - 思维导图: 思维导图.md
  - 操作日志: log.md
  - .NET:
      - dotnet/overview.md
      - C# 语言:
          - C# 现代语言特性: dotnet/csharp/modern-csharp.md
          - C# 14 新特性: dotnet/csharp/csharp-14.md
          - 异步编程: dotnet/csharp/async-await.md
      - 框架基础:
          - 依赖注入: dotnet/fundamentals/dependency-injection.md
      - Web / Minimal API:
          - ASP.NET Core 10: dotnet/aspnet-core/aspnet-core-10.md
      - 数据访问 EF Core:
          - EF Core 10: dotnet/ef-core/ef-core-10.md
          - EF Core 数据访问: dotnet/ef-core/ef-data-access.md
      - AOT 与部署:
          - 原生 AOT: dotnet/aot/native-aot.md
          - 文件型应用: dotnet/aot/file-based-apps.md
      - 运行时:
          - 运行时 JIT 优化: dotnet/runtime/jit-optimizations.md
      - Blazor:
          - Blazor JS 改进: dotnet/blazor/javascript-improvements.md
      - 版本对照:
          - .NET Core 3.0 / 3.1 / C# 8: dotnet/versions/netcore3.md
          - .NET 5 / C# 9: dotnet/versions/net5.md
          - .NET 6 / C# 10: dotnet/versions/net6.md
          - .NET 7 / C# 11: dotnet/versions/net7.md
          - .NET 8 / C# 12: dotnet/versions/net8.md
          - .NET 9 / C# 13: dotnet/versions/net9.md
  - 架构:
      - 模块化单体架构: architecture/modular-monolith.md
  - 工程规范:
      - 命名与 API 约定: standards/coding-conventions.md
      - 健壮性与工程质量: standards/quality-engineering.md
  - 实践:
      - 模式:
          - 组合与架构模式: patterns/composition.md
          - 释放与 using: patterns/disposable-using.md
      - 反模式:
          - 异步反模式: anti-patterns/async-antipatterns.md
          - 设计与可维护性反模式: anti-patterns/design-antipatterns.md
      - 对比:
          - record vs class: comparisons/record-vs-class.md
          - List vs ImmutableArray: comparisons/list-vs-immutablearray.md
          - RAG vs LLM Wiki: comparisons/rag-vs-llm-wiki.md
          - .NET 版本演进: comparisons/net-evolution.md
  - 治理:
      - 质量准则 QA: governance/qa.md
      - 持久约定 POLICY: governance/policy.md
      - 质量报告: governance/qa-report.md
      - 如何反馈: governance/feedback.md
      - 资料索引: sources/README.md

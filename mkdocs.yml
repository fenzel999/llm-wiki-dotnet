docs_dir: wiki

site_name: .NET LLM Wiki
site_description: .NET / C# 编程规范、最佳实践与语法演进的 LLM Wiki 知识库
site_url: https://fenzel999.github.io/llm-wiki-dotnet/
repo_url: https://github.com/fenzel999/llm-wiki-dotnet
repo_name: llm-wiki-dotnet
edit_uri: edit/main/wiki/

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换暗色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换亮色
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
      toc_depth: 3
  - attr_list
  - md_in_html
  - def_list
  - footnotes

extra:
  generator: false

nav:
  - 首页: index.md
  - 全景: overview.md
  - 思维导图: 思维导图.md
  - 操作日志: log.md
  - .NET 10:
      - dotnet/overview.md
      - 文件型应用: dotnet/file-based-apps.md
      - 原生 AOT: dotnet/native-aot.md
      - C# 14 新特性: dotnet/csharp/csharp-14.md
      - ASP.NET Core 10: dotnet/aspnet-core/aspnet-core-10.md
      - EF Core 10: dotnet/ef-core/ef-core-10.md
      - EF Core 数据访问: dotnet/ef-core/ef-data-access.md
      - 运行时 JIT 优化: dotnet/runtime/jit-optimizations.md
      - Blazor JS 改进: dotnet/blazor/javascript-improvements.md
      - 版本对照:
          - .NET 8 / C# 12: dotnet/versions/net8.md
          - .NET 9 / C# 13: dotnet/versions/net9.md
  - 语言与规范:
      - 语言概念:
          - 可空引用类型: concepts/nullable-reference-types.md
          - 记录(record): concepts/records.md
          - 模式匹配: concepts/pattern-matching.md
          - Span 与 Memory: concepts/span-memory.md
          - 依赖注入: concepts/dependency-injection.md
          - 异步编程: concepts/async-await.md
          - 泛型: concepts/generics.md
          - ValueTask: concepts/value-task.md
          - 源生成器: concepts/source-generators.md
      - 工程规范:
          - 命名: standards/naming.md
          - 异常处理: standards/exception-handling.md
          - 日志: standards/logging.md
          - 配置: standards/configuration.md
          - 单元测试: standards/unit-testing.md
          - API 设计: standards/api-design.md
          - 异步最佳实践: standards/async-best-practices.md
          - 空处理: standards/null-handling.md
  - 实践:
      - 模式:
          - Options 模式: patterns/options-pattern.md
          - 管道行为: patterns/pipeline-behavior.md
          - 泛型主机: patterns/generic-host.md
          - 最小 API 组织: patterns/minimal-api-organization.md
          - 释放与 using: patterns/disposable-using.md
      - 反模式:
          - 吞掉异常: anti-patterns/swallowing-exceptions.md
          - async void: anti-patterns/async-void.md
          - 魔法数字: anti-patterns/magic-numbers.md
          - 上帝方法: anti-patterns/god-methods.md
          - 服务定位器: anti-patterns/service-locator.md
          - 过度可变: anti-patterns/excessive-mutability.md
          - 阻塞异步: anti-patterns/blocking-async.md
          - 过早优化: anti-patterns/premature-optimization.md
      - 对比:
          - record vs class: comparisons/record-vs-class.md
          - List vs ImmutableArray: comparisons/list-vs-immutablearray.md
          - RAG vs LLM Wiki: comparisons/rag-vs-llm-wiki.md
          - .NET 版本演进: comparisons/net-evolution.md
  - 治理:
      - 质量准则 QA: governance/qa.md
      - 持久约定 POLICY: governance/policy.md
      - 质量报告: governance/qa-report.md
      - 如何反馈: governance/feedback.md
      - 资料索引: sources/README.md
